  ["team", "Team", "#1f4d3a"],

  ["vendor", "Vendors", "#1e3a5f"],
  ["tax", "Tax", "#8a6a2f"],

];

let chip = "all";

let focusBucket = null;

function money(n) {
  const v = Math.abs(Number(n) || 0);
  const whole = Math.round(v);
  if (Math.abs(v - whole) < 0.001) return "₹" + whole.toLocaleString("en-IN");
  const parts = v.toFixed(2).split(".");
  return "₹" + Number(parts[0]).toLocaleString("en-IN") + "." + parts[1];
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/\u0026/g, "\u0026amp;")
    .replace(/\u003c/g, "\u0026lt;")
    .replace(/\u003e/g, "\u0026gt;")
    .replace(/\u0022/g, "\u0026quot;");
}
function dmy(iso) {
  const [y, m, d] = iso.split("-");
  return (+d) + " " + MONTHS[+m - 1] + " " + y;
}
function monyr(iso) {
  const [y, m] = iso.split("-");
  return MONTHS[+m - 1] + " " + y;
}

  const words = String(name).replace(/\(.*?\)/g, "").split(/[^A-Za-z0-9]+/).filter(Boolean);
  return ((words[0] || "?").slice(0, 1) + (words[1] || "").slice(0, 1)).toUpperCase();
}
function emails() {
  return DATA.emailBills.map(b => ({

    name: b.name,

    cadenceLabel: b.cadence,

  }));
}

  if (id === "vendors") return DATA.rows.filter(r => r.bucket === "vendor" || r.bucket === "tax").length;
  if (id === "bills") return DATA.rows.filter(r => BILLS.has(r.name) || r.invoice).length + DATA.emailBills.length;
  return DATA.rows.filter(r => r.bucket === "internal").length;
}

function pool() {
  let rows;
  if (tab === "vendors") rows = DATA.rows.filter(r => r.bucket === "vendor" || r.bucket === "tax");
  else if (tab === "bills") rows = DATA.rows.filter(r => BILLS.has(r.name) || r.invoice);
  else if (tab === "moved") rows = DATA.rows.filter(r => r.bucket === "internal");
  else rows = DATA.rows.filter(r => ["team","family","other","cash"].includes(r.bucket));
  if (focusBucket) rows = rows.filter(r => r.bucket === focusBucket);
  if (acctFilter !== "all") {
    rows = rows.filter(r => (r.accounts || []).some(a => acctFilter === "savings" ? a.short.includes("6536") : a.short.includes("8760")));
  }
  return rows;
}
function where(r) {
  const shorts = (r.accounts || []).map(a => a.short);
  if (shorts.length === 1 && shorts[0].includes("8760")) return "";
  if (shorts.length === 1) return " · " + shorts[0];
  if (shorts.length > 1) return " · both accounts";
  return "";
}
function rowBtn(r) {
  const amt = r.email ? esc(r.amountLabel) : money(r.total);
  return `<button type="button" class="row${selected === r.id ? " on" : ""}" data-id="${esc(r.id)}">

}

  const html = items.map(([id, label]) => `<option value="${id}">${esc(label)}${id === "all" ? "" : " · " + counts[id]}</option>`).join("");

}

        const group = rows.filter(r => r.cadence === id);
        if (!group.length) {
          if (id === "every-3-months" && chip === "all" && !focusBucket) {
            html += `<div class="group">Every 3 months</div><p class="empty">Nobody was paid on a steady 3-month cycle.</p>`;
          }
          continue;

        html += `<div class="group">${esc(label)}</div>` + group.map(rowBtn).join("");

      html += `<div class="group">On the statement</div>` + pool().map(rowBtn).join("");
      html += `<div class="group">In email, not on this account</div><p class="railnote">Not inside the ${esc(money(DATA.totalOut))} total.</p>` + emails().map(rowBtn).join("");

}

      <div>
        <div class="paytop">
          <strong class="payamt">${money(p.amount)}</strong>
          <span class="frombit"><span>From</span> ${esc(p.accountShort)}</span>
          ${to}
        </div>
        <details><summary>Statement line</summary><p>${esc(p.narration)}</p></details>
      </div>
    </li>`;
  }).join("");
}
function showDetail(r) {
  selected = r.id;
  history.replaceState(null, "", "#" + r.id);
  const last = r.fy["2025-26"] || { n: 0, total: 0 };
  const cur = r.fy["2026-27"] || { n: 0, total: 0 };
  const c25 = r.cal["2025"] || { n: 0, total: 0 };
  const c26 = r.cal["2026"] || { n: 0, total: 0 };
  const banks = banksOf(r);
  const fromBody = r.accounts.map(a =>
    `<strong>${esc(a.label)}</strong><span class="sub">${a.n === r.n ? "Every payment left this account." : a.n + " payment" + (a.n === 1 ? "" : "s") + " · " + money(a.total)}</span>`
  ).join("");
  const toBody = banks.length
    ? banks.map(([name, n]) => `<strong>${esc(name)}</strong><span class="sub">${n} payment${n === 1 ? "" : "s"}</span>`).join("")
    : `<strong>Not on the statement</strong><span class="sub">The narration has no destination bank.</span>`;
  const inv = r.invoice ? `<aside class="note"><p class="badge">Not on the statement</p><h3>Invoice ${esc(r.invoice.number)} · ${esc(dmy(r.invoice.date))} · ${money(r.invoice.total)}</h3><p>Professional fee ${money(r.invoice.professional)} plus GST ${money(r.invoice.gst)}. ${esc(r.invoice.note)}</p></aside>` : "";
  const fy1 = r.months.slice(0, 12);
  const fy2 = r.months.slice(12);
  viewEl.innerHTML = `
    <button type="button" class="back" id="back">Back to the list</button>
    <p class="kicker">${esc(r.tag)} · ${esc(CADENCE_LABEL[r.cadence] || r.cadence)} · ${r.n} payment${r.n === 1 ? "" : "s"}</p>
    <h2>${esc(r.name)}</h2>
    <p class="lead">${esc(r.sentence)}.</p>
    <section class="hero">
      <div class="hero-row">
        <div>
          <p class="kicker">All paid</p>
          <p class="when">${esc(dmy(r.first))} – ${esc(dmy(r.last))}</p>
        </div>
        <strong>${money(r.total)}</strong>
      </div>
      <div class="splitbar">
        ${last.total ? `<i class="last" style="flex:${last.total}"></i>` : ""}
        ${cur.total ? `<i class="now" style="flex:${cur.total}"></i>` : ""}
        ${!last.total && !cur.total ? `<i class="last" style="flex:1;opacity:.3"></i>` : ""}
      </div>
      <div class="splitlab">
        <p class="last"><b>Last year · FY 2025–26</b><strong>${money(last.total)}</strong><br>${last.n ? last.n + " payment" + (last.n === 1 ? "" : "s") + " · Apr 2025 – Mar 2026" : "No payment in that year"}</p>
        <p class="now"><b>This year · FY 2026–27 so far</b><strong>${money(cur.total)}</strong><br>${cur.n ? cur.n + " payment" + (cur.n === 1 ? "" : "s") + " · Apr–Sep 2026" : "No payment through Sep 2026"}</p>
      </div>
      <p class="cal">Calendar 2025 ${money(c25.total)} · Calendar 2026 ${money(c26.total)}.</p>
    </section>
    ${inv}
    <div class="from">
      <article><p class="k">From account</p>${fromBody}</article>
      <article><p class="k">To</p>${toBody}</article>
    </div>
    <h3 class="sec">Each payment · newest first</h3>
    <ol class="pays">${payList(r)}</ol>
    <div class="years">
      <article class="year"><p class="k">FY 2025–26 by month</p><em>${last.n ? last.n + " payment" + (last.n === 1 ? "" : "s") : "Nothing paid"}</em>${bars(fy1, DATA.monthLabels.slice(0, 12))}</article>
      <article class="year nowish"><p class="k">FY 2026–27 by month</p><em>${cur.n ? cur.n + " payment" + (cur.n === 1 ? "" : "s") + " · through Sep" : "Nothing through Sep 2026"}</em>${bars(fy2, DATA.monthLabels.slice(12))}</article>
    </div>
    <p class="foot">Only ${esc(DATA.account)}. Statements run through 30 Sep 2026.</p>`;
  detailEl.classList.add("show");
  paintList();
  if (window.innerWidth <= 860) detailEl.scrollTop = 0;
  else detailEl.scrollTop = 0;
}
function showEmail(b) {
  selected = b.id;
  history.replaceState(null, "", "#" + b.id);
  viewEl.innerHTML = `
    <button type="button" class="back" id="back">Back to the list</button>
    <p class="kicker">Email bill · not on this account</p>
    <h2>${esc(b.name)}</h2>
    <p class="lead">${esc(b.cadenceLabel)} · ${esc(b.amountLabel)}.</p>
    <aside class="note"><p class="badge">Not in the total</p><h3>In the mailbox only</h3><p>${esc(b.note)} The ${esc(money(DATA.totalOut))} is every debit on ${esc(DATA.account)}, and this bill is not one of them.</p></aside>
    <p class="foot">${DATA.gaps.map(esc).join(" ")}</p>`;
  detailEl.classList.add("show");
  paintList();
  detailEl.scrollTop = 0;
}
function renderHome() {
  const parts = BUCKETS.map(([id, label, color]) => ({
    id, label, color,
    total: DATA.rows.filter(r => r.bucket === id).reduce((s, r) => s + r.total, 0)
  })).filter(p => p.total > 0);
  const sum = parts.reduce((s, p) => s + p.total, 0) || 1;
  const bar = `<div class="bar">${parts.map(p => `<i style="width:${(p.total / sum * 100).toFixed(3)}%;background:${p.color}" title="${esc(p.label + " " + money(p.total))}"></i>`).join("")}</div>`;
  const bucks = `<ul class="bucks">${parts.map(p => `<li><button type="button" class="buck" data-bucket="${p.id}"><i class="sw" style="background:${p.color}"></i><span>${esc(p.label)}</span><em>${money(p.total)}</em></button></li>`).join("")}</ul>`;
  const top = DATA.rows.slice(0, 6).map(r => `<button type="button" class="mini" data-id="${esc(r.id)}"><span><span class="mini-name">${esc(r.name)}</span><small>${esc(r.tag)} · ${esc(r.sentence)}</small></span><span class="amt">${money(r.total)}</span></button>`).join("");
  const pooja = DATA.rows.find(r => r.id === "pooja-talwar");
  const kg = DATA.rows.find(r => r.id === "kg-sharma-co");
  function feat(r, extra) {
    if (!r) return "";
    return `<button type="button" class="feat" data-id="${esc(r.id)}"><p class="kicker">${esc(r.tag)}</p><h3>${esc(r.name)}</h3><p>${extra}</p><p class="big">${money(r.total)} all paid</p></button>`;
  }
  const poojaExtra = pooja ? `${pooja.n} payments, all from ${esc(pooja.accounts[0].short)}${banksOf(pooja).length === 1 ? ", to " + esc(banksOf(pooja)[0][0]) : ""}.` : "";
  const kgExtra = kg ? `Last year ${money((kg.fy["2025-26"] || {}).total || 0)} · this year ${money((kg.fy["2026-27"] || {}).total || 0)}.${kg.invoice ? " Invoice " + money(kg.invoice.total) + " is not a debit yet." : ""}` : "";
  viewEl.innerHTML = `
    <button type="button" class="back" id="back">Back to the list</button>
    <p class="eyebrow">Overview</p>
    <h2>Where the money went</h2>
    <div class="years">${(DATA.accounts || []).map(a => `<article class="year"><p class="k">${esc(a.label)}</p><strong>${money(a.total)}</strong><em>${esc(a.period)}</em></article>`).join("")}</div>
    <p class="lead">Together ${money(DATA.totalOut)}. Money moved from one of these accounts to the other sits under Moved, so it is not also shown as a vendor.</p>
    ${bar}
    ${bucks}
    <p class="hint">Choose a group to filter the list. The groups add up to the total.</p>
    <h3 class="block">Open a name</h3>
    <div class="feats">
      ${feat(pooja, poojaExtra)}
      ${feat(kg, kgExtra)}
    </div>
    <h3 class="block">Largest</h3>
    <div class="toplist">${top}</div>
    <h3 class="block">What this does not pretend</h3>
    <p class="quiet">Nobody was paid on a steady 3-month cycle. One payment in a year is not proof of a yearly bill.</p>
    <ul class="gaps">${DATA.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul>`;
}
function openId(id) {
  const email = emails().find(x => x.id === id);
  if (email) {
    tab = "bills"; chip = "all"; focusBucket = null; qEl.value = "";
    showEmail(email);
    return;
  }
  const r = DATA.rows.find(x => x.id === id);
  if (!r) { goHome(); return; }
  qEl.value = "";
  chip = "all";
  focusBucket = null;
  if (r.bucket === "internal") tab = "moved";
  else if (!(tab === "bills" && (BILLS.has(r.name) || r.invoice)) && !(tab === "vendors" && (r.bucket === "vendor" || r.bucket === "tax")) && !(tab === "payees" && ["team","family","other","cash"].includes(r.bucket))) {
    if (r.bucket === "vendor" || r.bucket === "tax") tab = "vendors";
    else tab = "payees";
  }
  showDetail(r);
}
function goHome() {
  selected = null;
  history.replaceState(null, "", location.pathname);
  renderHome();
  detailEl.classList.add("show");
  paintList();
  if (window.innerWidth > 860) detailEl.scrollTop = 0;
}
function closeMobile() {
  selected = null;
  history.replaceState(null, "", location.pathname);
  detailEl.classList.remove("show");
  paintList();
  if (window.innerWidth > 860) renderHome();
}
document.body.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { tab = tabBtn.dataset.tab; chip = "all"; focusBucket = null; paintList(); listEl.scrollTop = 0; return; }
  const chipBtn = e.target.closest("[data-chip]");
  if (chipBtn) { chip = chipBtn.dataset.chip; paintList(); listEl.scrollTop = 0; return; }
  if (e.target.closest("[data-clear]")) { focusBucket = null; paintList(); return; }
  const buck = e.target.closest("[data-bucket]");
  if (buck) {
    const b = buck.dataset.bucket;
    if (b === "internal") { tab = "moved"; focusBucket = null; }
    else if (b === "vendor" || b === "tax") { tab = "vendors"; focusBucket = b; }
    else { tab = "payees"; focusBucket = b; }
    chip = "all"; qEl.value = "";
    paintList(); listEl.scrollTop = 0;
    return;
  }
  const idBtn = e.target.closest("[data-id]");
  if (idBtn) { openId(idBtn.dataset.id); return; }
  if (e.target.closest("#back")) { closeMobile(); return; }
});
document.getElementById("homebtn").addEventListener("click", goHome);
document.getElementById("cadence").addEventListener("change", e => {
  chip = e.target.value;
  paintList();
  listEl.scrollTop = 0;
});
document.getElementById("acctsel").addEventListener("change", e => {
  acctFilter = e.target.value;
  paintList();
  listEl.scrollTop = 0;
});
qEl.addEventListener("input", () => { paintList(); listEl.scrollTop = 0; });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (qEl.value) { qEl.value = ""; paintList(); return; }
  if (window.innerWidth <= 860 && detailEl.classList.contains("show")) closeMobile();
  else if (selected) goHome();
});
paintList();
if (location.hash) openId(decodeURIComponent(location.hash.slice(1)));
else if (window.innerWidth > 860) renderHome();
</script>
</body>
</html>
